<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Owner Dashboard - REVOMAKER STEAM</title><link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/style.css">
<style>
input,select,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--l);border-radius:12px;padding:11px 14px;margin:6px 0;outline:0;transition:.2s}input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(139,92,246,.25)}select option{background:#14141c}
.box{max-width:420px;margin:12vh auto;padding:34px;border-radius:24px;background:rgba(15,15,22,.6);backdrop-filter:blur(20px);border:1px solid var(--l);text-align:center;animation:up .8s both}.box .logo{width:84px;height:84px;margin:0 auto 18px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.sb{position:sticky;top:0;height:100vh;padding:20px 16px;background:rgba(9,9,13,.6);backdrop-filter:blur(20px);border-right:1px solid var(--l);display:flex;flex-direction:column;gap:6px}
.sb .top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.sb .logo{width:44px;height:44px}.sb button,.sb a{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:0;border-radius:14px;background:none;color:var(--m);font-weight:700;font-size:14px;cursor:pointer;transition:.25s}
.sb button:hover,.sb a:hover{background:var(--c);color:#fff;transform:translateX(4px)}.sb button.on{background:var(--g);background-size:300% 100%;color:#fff;box-shadow:0 8px 24px rgba(139,92,246,.4)}.sb .sp{flex:1}
main{padding:28px 4vw 60px;min-width:0}.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}.hd h1{font-size:clamp(24px,4vw,34px)}.hd p{color:var(--m)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}.k{padding:20px;border-radius:20px;background:rgba(15,15,22,.55);backdrop-filter:blur(16px);border:1px solid var(--l);animation:up .7s both;transition:.3s}.k:hover{transform:translateY(-5px);border-color:var(--p)}
.k i{font-style:normal;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--g);background-size:300% 100%;margin-bottom:12px}.k b{display:block;font-size:30px;font-weight:900}.k small{color:var(--m);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.pn{padding:22px;border-radius:22px;background:rgba(15,15,22,.55);backdrop-filter:blur(16px);border:1px solid var(--l);margin-bottom:20px}.pn h3{margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.lg{font-size:12px;color:var(--m);font-weight:600}.lg s{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 12px;text-decoration:none}
.cs{width:100%;height:auto;display:block}.ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1500;stroke-dashoffset:1500;animation:dr 1.8s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.tp{display:flex;align-items:center;gap:12px;margin:12px 0;font-size:14px}.tp img,.tp .ph{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--g);flex:none}.tp div{flex:1;min-width:0}.tp span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.br{height:6px;border-radius:9px;background:var(--c);margin-top:6px;overflow:hidden}.br i{display:block;height:100%;border-radius:9px;background:var(--g);transform-origin:left;animation:bw 1s cubic-bezier(.2,.9,.3,1) both}@keyframes bw{from{transform:scaleX(0)}}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}.dc{border-radius:20px;overflow:hidden;background:rgba(15,15,22,.6);backdrop-filter:blur(14px);border:1px solid var(--l);position:relative;transition:.3s;animation:up .6s both}.dc:hover{transform:translateY(-6px);border-color:var(--p);box-shadow:0 18px 40px rgba(139,92,246,.25)}
.dc .th{aspect-ratio:16/9}.dc .cb{padding:14px}.dc h4{font-size:16px}.dc small{color:var(--m)}.pill{position:absolute;top:10px;right:10px;font-style:normal;font-size:10px;font-weight:900;letter-spacing:.12em;padding:4px 10px;border-radius:99px;background:rgba(239,68,68,.85)}.pill.ok{background:rgba(16,185,129,.9)}
.ft{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.ft .btn{padding:7px 12px;font-size:11px}.ed{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}.ed .card{opacity:1;transform:none;max-width:340px}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px;margin:8px 0}label.ck input{width:auto;margin:0}.err{color:#fb7185;font-size:13px;min-height:20px}
@media(max-width:850px){.app{grid-template-columns:1fr}.sb{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}.sb .top{display:none}.sb .sp{display:none}.sb button,.sb a{width:auto;padding:9px 12px}.ed{grid-template-columns:1fr}}
</style></head><body>
<video id="bgv" autoplay muted loop playsinline preload="auto" poster="/bg.jpg" aria-hidden="true"><source src="/bg.mp4" type="video/mp4"></video><i class="veil"></i>
<div id="login" class="box" hidden><div class="logo"><img src="/logo.svg" alt="logo"></div><h2>OWNER ACCESS</h2><p style="color:var(--m);margin-bottom:12px">Authorized owners only.</p>
<form id="lf"><input id="u" placeholder="Username" autocomplete="username" required><input id="p" type="password" placeholder="Password" autocomplete="current-password" required><p class="err" id="le"></p><button class="btn" style="width:100%">LOGIN</button></form></div>
<div id="app" class="app" hidden><aside class="sb"><div class="top"><span class="logo"><img src="/logo.svg" alt="logo"></span><span class="brand">REVOMAKER<br><span>DASHBOARD</span></span></div>
<button data-v="ov" class="on">&#128202; Overview</button><button data-v="dr">&#128230; Drops</button><button data-v="ed" id="nb">&#10133; New Drop</button><span class="sp"></span><a href="/">&#127760; View site</a><button id="out">&#128682; Logout</button></aside>
<main><div class="hd"><div><h1 id="gr">Welcome back</h1><p>Here is how REVOMAKER STEAM is doing.</p></div></div>
<section class="sec" id="v-ov"><div class="kp" id="kp"></div><div class="pn"><h3>Last 14 days<span class="lg"><s style="background:#a78bfa"></s>Views<s style="background:#3b82f6"></s>Clicks</span></h3><div id="ch"></div></div>
<div class="cols"><div class="pn"><h3>Top drops</h3><div id="top5"></div></div><div class="pn"><h3>Views by category</h3><div id="cv"></div></div></div></section>
<section class="sec" id="v-dr" hidden><input id="sq" placeholder="Search your drops..." aria-label="Search drops"><div class="dg" id="dg"></div></section>
<section class="sec" id="v-ed" hidden><div class="ed"><div class="pn"><h3 id="ft">New Drop</h3><form id="f"><input id="t" placeholder="Title" maxlength="80" required><select id="c"></select><input id="url" type="url" placeholder="https://external-url" required><textarea id="d" rows="3" maxlength="500" placeholder="Description"></textarea>
<label>Thumbnail<input id="th" type="file" accept="image/png,image/jpeg,image/webp"></label><label class="ck"><input id="pub" type="checkbox" checked> Published</label><label class="ck"><input id="fe" type="checkbox"> Featured</label>
<p class="err" id="fe2"></p><button class="btn">SAVE DROP</button> <button class="btn ghost" type="button" id="rs">RESET</button></form></div>
<div><p style="color:var(--m);margin:0 0 10px;font-size:13px;letter-spacing:.1em">LIVE PREVIEW</p><div id="pv"></div></div></div></section></main></div>
<script src="admin.js"></script></body></html>
