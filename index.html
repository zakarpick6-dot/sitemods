.glow{display:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 0;font-size:11px;color:var(--mut);letter-spacing:.1em}

.sub{max-width:520px;color:var(--mut);margin:14px 0 22px}
.strip{direction:ltr;background:var(--y);color:#111;overflow:hidden;white-space:nowrap;border-block:3px solid #111;transform:rotate(-1.2deg) scale(1.03);margin:18px 0 26px;padding:0}
.strip div{display:inline-block;padding:8px 0;animation:mq 22s linear infinite;font-weight:700}
.strip span{margin:0 18px}.strip i{font-style:normal}
@keyframes mq{to{transform:translateX(-50%)}}
.road{height:6px;background:repeating-linear-gradient(90deg,var(--y) 0 34px,transparent 34px 64px);margin:6px 0 22px;animation:rd 1.6s linear infinite;background-size:64px 6px}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}
.chip{font:700 13px inherit;font-family:inherit;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:6px 12px;cursor:pointer;transition:.15s}
.chip:hover{transform:translateY(-3px) rotate(-2deg)}
.chip.on{background:var(--y);color:#111;border-color:#111}
.up{margin-inline-start:auto;background:var(--y);color:#111;border:3px solid #111;box-shadow:5px 5px 0 #111;font:700 13px inherit;font-family:inherit;padding:9px 18px;cursor:pointer;transition:.15s}
.up:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 #111}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--card);color:var(--ink);border:2px solid var(--ink);padding:0 0 14px;display:flex;flex-direction:column;gap:6px;transition:transform .2s,box-shadow .2s;animation:in .5s both}
.card:nth-child(3n+1){transform:rotate(-1.2deg)}.card:nth-child(3n+2){transform:rotate(.8deg)}.card:nth-child(3n){transform:rotate(-.4deg)}
.card:hover{transform:rotate(0) translateY(-6px);box-shadow:8px 8px 0 var(--y)}
@keyframes in{from{opacity:0;margin-top:24px}}
.card::before,.card::after{display:none}
.img{height:150px;background:#000 center/cover;display:flex;align-items:center;justify-content:center;color:var(--y);font:400 46px Anton,sans-serif;position:relative;overflow:hidden;filter:none}
.img .a{position:absolute;inset:0;background:center/cover;clip-path:inset(0 0 0 var(--w,100%))}
.img .ln{position:absolute;top:0;bottom:0;width:3px;background:var(--y);left:var(--w,100%);display:none}
.rs:hover .ln{display:block}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700;color:var(--mut);padding:4px 14px 0}
.meta b{background:var(--y);color:#111;padding:0 6px}
h3{font:400 26px/1 Anton,Impact,sans-serif;text-transform:uppercase;margin:0;padding:0 14px}
.card p{margin:0;padding:0 14px;color:var(--mut);font-size:13px;flex:1;word-break:break-word}
code{display:block;direction:ltr;background:#000;color:var(--y);padding:6px 8px;font-size:12px;overflow-x:auto;white-space:pre;margin:0 14px;border:1px solid #2a2a2a}
.act{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px}
.act a,.act button{flex:1;min-width:88px;text-align:center;font:700 13px inherit;font-family:inherit;padding:7px;border:2px solid var(--y);background:var(--y);color:#111;text-decoration:none;cursor:pointer}
.act .x{flex:0 0 36px;background:transparent;color:var(--y);border-color:var(--y)}
.msg{grid-column:1/-1;border:2px dashed var(--ink);padding:40px 20px;text-align:center;color:var(--mut)}

let L       = "en";
let filter  = "All";
let authMode= "in";
try{const s=localStorage.getItem("lg");if(s&&T[s])L=s;else{const n=(navigator.language||"en").slice(0,2);if(T[n])L=n}}catch(e){}
const $=id=>document.getElementById(id);
const t=k=>T[L][k]||T.en[k];
const cn=c=>T[L].cats[CATS.indexOf(c)]||c;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https?:\/\//i.test(u||"")?esc(u):"";
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),3200)}
function ask(title,inp){return new Promise(res=>{const d=$("mdlg");$("mt").textContent=title;$("mr").hidden=!inp;$("mr").value="";$("mn").textContent=t("cn");$("my").textContent=t("ok");
  $("mn").onclick=()=>{d.close();res(null)};$("my").onclick=()=>{d.close();res(inp?$("mr").value:true)};d.oncancel=()=>res(null);d.showModal()})}

const isStaff=()=>myRole==="owner"||myRole==="admin";
const canDrop=()=>myRole==="owner"||myRole==="admin";
const rn=r=>t({owner:"ro",admin:"ra",dropper:"rd",member:"rm"}[r]||"rm");

/* ===== SIGN IN ===== */
function syncAuthDlg(){
  const up = authMode==="up";
  $("authtitle").textContent = up ? t("su") : t("sg");
  $("authgo").textContent    = up ? t("su") : t("sg");
  $("authmode").textContent  = up ? t("hac") : t("hnc");
  $("autherr").hidden = true;
}
function openAuth(mode){
  authMode = mode||"in";
  $("authu").value=""; $("authp").value="";
  syncAuthDlg();
  $("authdlg").showModal();
  setTimeout(()=>$("authu").focus(),60);
}
function showAuthErr(m){const e=$("autherr");e.textContent=m;e.hidden=false}
$("authmode").onclick=()=>{authMode=authMode==="up"?"in":"up";syncAuthDlg()};
$("authclose").onclick=()=>$("authdlg").close();
$("authgo").onclick=()=>{
  const user=$("authu").value.trim().toLowerCase();
  const pass=$("authp").value;
  if(!user)return showAuthErr(t("e10"));
  if(!/^[a-z0-9_.-]{2,20}$/.test(user))return showAuthErr(t("e11"));
  if(pass.length<4)return showAuthErr(t("e12"));
  if(authMode==="up"){
    if(users[user])return showAuthErr(t("e13"));
    const isFirst=Object.keys(users).length===0;
    users[user]={pass:hash(pass),role:isFirst?"owner":"member"};
    store.write(ST.users,users);
    session=user;store.write(ST.session,user);
    $("authdlg").close();
    toast(isFirst?t("ownerw"):t("welc")+", "+user);
  }else{
    const u=users[user];
    if(!u)return showAuthErr(t("e14"));
    if(u.pass!==hash(pass))return showAuthErr(t("e15"));
    session=user;store.write(ST.session,user);
    $("authdlg").close();
    toast(t("welc")+", "+user);
  }
  bootUser();
};
function signOut(){
  session=null;store.write(ST.session,null);
  me=null;myRole="member";
  updateTop();render();
  toast(t("so"));
}
function bootUser(){
  if(!session||!users[session]){me=null;myRole="member";updateTop();render();return}
  const u=users[session];
  me={id:session,name:session,isOwner:u.role==="owner"};
  myRole=me.isOwner?"owner":(u.role||"member");
  names={};for(const k in users)names[k]=k;
  updateTop();render();
}

/* ============================================================
   RESET DATA — wipes localStorage & reloads
   ============================================================ */
function openReset(){
  $("resettitle").textContent = t("rsta");
  $("resetmsg").textContent   = t("rstm");
  $("resetcancel").textContent= t("cn");
  $("resetok").textContent    = t("rst2");
  $("resetdlg").showModal();
}
$("resetcancel").onclick = ()=>$("resetdlg").close();
$("resetok").onclick = ()=>{
  try{
    /* remove every key this app uses */
    localStorage.removeItem("fv_users");
    localStorage.removeItem("fv_posts");
    localStorage.removeItem("fv_session");
    localStorage.removeItem("lg");
    /* also clear old-version keys just in case */
    localStorage.removeItem("fv_users_v2");
    localStorage.removeItem("fv_posts_v2");
    localStorage.removeItem("fv_session_v2");
    localStorage.removeItem("fv_users_v3");
    localStorage.removeItem("fv_posts_v3");
    localStorage.removeItem("fv_session_v3");
    localStorage.removeItem("fv_users_v4");
    localStorage.removeItem("fv_posts_v4");
    localStorage.removeItem("fv_session_v4");
    localStorage.removeItem("fv_lang");
  }catch(e){}
  location.reload();
};

/* ===== TEAM ===== */
function renderTeam(){
  const q=($("tq").value||"").toLowerCase();
  const ids=Object.keys(users).filter(u=>u.toLowerCase().includes(q));
  const rows=ids.map(u=>{
    const r=users[u].role,lock=r==="owner"||(r==="admin"&&myRole!=="owner");
    let opts=["member"];
    if(myRole==="owner")opts=["member","dropper","admin","owner"];
    else if(myRole==="admin")opts=["member","admin"];
    if(!opts.includes(r))opts.push(r);
    return `<div class="tr"><span>${esc(u)}</span><select data-u="${esc(u)}" ${lock?"disabled":""}>${opts.map(o=>`<option value="${o}" ${o===r?"selected":""}>${rn(o)}</option>`).join("")}</select></div>`;
  }).join("");
  $("tl").innerHTML=rows||`<div class="msg">—</div>`;
  $("tl").querySelectorAll("select").forEach(sel=>sel.onchange=()=>{
    users[sel.dataset.u].role=sel.value;
    store.write(ST.users,users);
    if(sel.dataset.u===session)bootUser();else render();
  });
}

/* ===== LANG ===== */
function setLang(l){
  L=l;try{localStorage.setItem("lg",l)}catch(e){}
  document.documentElement.lang=l;
  document.documentElement.dir=l==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  const v=$("c").value;
  $("c").innerHTML=CATS.map(c=>`<option value="${c}">${esc(cn(c))}</option>`).join("");
  $("c").value=v||CATS[0];
  $("mq").innerHTML=("<span>"+T[L].cats.join("</span><i>★</i><span>")+"</span><i>★</i>").repeat(4);
  $("lgs").innerHTML=Object.keys(T).map(k=>`<button class="lg ${k===L?"on":""}" data-l="${k}">${T[k].n}</button>`).join("");
  $("lgs").querySelectorAll(".lg").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
  syncForm();updateTop();render();
  if($("authdlg").open)syncAuthDlg();
  if($("tdlg").open)renderTeam();
}
function syncForm(){const v=$("c").value;$("cw").hidden=v!=="F8 Command";$("i2w").hidden=v!=="ReShade Preset";$("il").textContent=v==="ReShade Preset"?t("bf"):t("pv")}
$("c").onchange=syncForm;

/* ===== TOP + BAR ===== */
function updateTop(){
  const ok=!!me;
  $("me").hidden=!ok;
  if(ok)$("me").textContent=t("yr")+": "+rn(myRole);
  $("teamb").hidden=!isStaff();
  $("resetb").hidden=!(me&&me.isOwner);   /* only owner sees reset */
  $("authb").textContent=ok?t("so"):t("sg");
  $("authb").onclick=ok?signOut:()=>openAuth("in");
  bar();
}
function bar(){
  $("bar").innerHTML=["All",...CATS].map(c=>`<button class="chip ${c===filter?"on":""}" data-c="${c}">${c==="All"?t("all"):esc(cn(c))}</button>`).join("")+(canDrop()?`<button class="up" id="upb">${t("up")}</button>`:"");
  $("bar").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.c;bar();render()});
  if($("upb"))$("upb").onclick=()=>{if(!me){toast(t("si"));openAuth("in");return}if(!canDrop()){toast(t("nup"));return}$("dlg").showModal()};
}

/* ===== RENDER ===== */
function render(){
  const mod=p=>me&&((me.id===p.by&&canDrop())||isStaff());
  const list=posts.filter(p=>(filter==="All"||p.cat===filter)&&(!p.canceled||mod(p)));
  if(!list.length){$("grid").innerHTML=`<div class="msg">${t("em")}</div>`;return}
  $("grid").innerHTML=list.map((p,i)=>`
  <div class="card ${p.img2?"rs":""} ${p.canceled?"cx":""}">
    <div class="img" ${p.img?`style="background-image:url('${esc(p.img)}')"`:""}>${p.img?"":ICON[p.cat]||"◈"}${p.img2?`<div class="a" style="background-image:url('${esc(p.img2)}')"></div><div class="ln"></div>`:""}${p.canceled?`<div class="stamp">${t("rn")}</div>`:""}</div>
    <div class="meta"><span>${String(i+1).padStart(2,"0")}A · ${esc(cn(p.cat))}</span><span>${p.admin?`<b>${t("adm")}</b>`:t("by")+" "+esc(names[p.by]||p.by||"…")}</span></div>
    <h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p>${p.canceled&&p.reason?`<p class="rsn">${esc(p.reason)}</p>`:""}
    ${p.cmd?`<code>${esc(p.cmd)}</code>`:""}
    <div class="act">
      ${p.link&&safe(p.link)?`<button data-dl="${p.id}">${t("dl")}</button>`:""}
      ${p.cmd?`<button data-cp="${p.id}">${t("cp")}</button>`:""}
      ${p.img?`<button data-im="img" data-id="${p.id}">${t("di")}${p.img2?" 1":""}</button>`:""}
      ${p.img2?`<button data-im="img2" data-id="${p.id}">${t("di")} 2</button>`:""}
      ${mod(p)?`<button data-cx="${p.id}">${p.canceled?t("rs2"):t("cx")}</button>`:""}
      ${me&&me.id!==p.by&&!p.canceled?`<button data-rp="${p.id}" ${(p.reports||[]).includes(me.id)?"disabled":""}>⚑ ${(p.reports||[]).includes(me.id)?t("rpd"):t("rp")}</button>`:""}
      ${isStaff()&&(p.reports||[]).length?`<button class="x" disabled>⚑ ${(p.reports||[]).length}</button>`:""}
      ${mod(p)?`<button class="x" data-del="${p.id}">✕</button>`:""}
    </div>
  </div>`).join("");

  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=async()=>{const p=posts.find(x=>x.id===b.dataset.cp);try{await navigator.clipboard.writeText(p.cmd);b.textContent=t("cd")}catch(e){}});
  document.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{const p=posts.find(x=>x.id===b.dataset.dl);if(!p||!p.link)return;const a=document.createElement("a");a.href=p.link;a.target="_blank";a.rel="noopener noreferrer";a.style.position="fixed";a.style.left="-9999px";document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);setTimeout(()=>{try{window.open(p.link,"_blank","noopener")}catch(e){}},250)});
  document.querySelectorAll("[data-im]").forEach(b=>b.onclick=()=>{
    const p=posts.find(x=>x.id===b.dataset.id),k=b.dataset.im,u=p&&p[k];if(!u)return;
    const nm=((p.title||"image").replace(/[^\w\- ]+/g,"").trim().slice(0,60)||"image")+(k==="img2"?"-after":"")+".jpg";
    try{const a=document.createElement("a");a.href=u;a.download=nm;a.style.position="fixed";a.style.left="-9999px";document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);return}catch(e){}
    try{const arr=u.split(","),mime=(arr[0].match(/:(.*?);/)||[,"image/jpeg"])[1],bin=atob(arr[1]);let n=bin.length;const u8=new Uint8Array(n);while(n--)u8[n]=bin.charCodeAt(n);const bl=new Blob([u8],{type:mime});const url=URL.createObjectURL(bl);const a=document.createElement("a");a.href=url;a.download=nm;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);return}catch(e){}
    try{window.open(u,"_blank")}catch(e){}
  });
  document.querySelectorAll("[data-cx]").forEach(b=>b.onclick=async()=>{const p=posts.find(x=>x.id===b.dataset.cx);if(p.canceled)p.canceled=false,p.reason="";else{const r=await ask(t("rq"),true);if(r===null)return;p.canceled=true;p.reason=r.trim().slice(0,200)}store.write(ST.posts,posts);render()});
  document.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>{const p=posts.find(x=>x.id===b.dataset.rp);p.reports=[...new Set([...(p.reports||[]),me.id])];store.write(ST.posts,posts);render()});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(await ask(t("q"),false)){posts=posts.filter(x=>x.id!==b.dataset.del);store.write(ST.posts,posts);render()}});
}
addEventListener("pointermove",e=>{const im=e.target.closest&&e.target.closest(".rs .img");if(im){const b=im.getBoundingClientRect();im.style.setProperty("--w",Math.min(100,Math.max(0,(e.clientX-b.left)/b.width*100))+"%")}});

/* ===== UPLOAD ===== */
function fileToDataURL(file,max=900,q=.72){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;
    fr.onload=()=>{const im=new Image();im.onerror=rej;
      im.onload=()=>{let w=im.width,h=im.height;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
        const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(im,0,0,w,h);res(cv.toDataURL("image/jpeg",q))};
      im.src=fr.result};
    fr.readAsDataURL(file)});
}
$("cancel").onclick=()=>$("dlg").close();
$("post").onclick=async()=>{
  if(!me){toast(t("si"));openAuth("in");return}
  if(!canDrop()){toast(t("nup"));return}
  const title=$("t").value.trim(),link=$("l").value.trim(),cmd=$("m").value.trim(),cat=$("c").value;
  if(!title){toast(t("e1"));return}
  if(!link&&!cmd){toast(t("e2"));return}
  if(link&&!safe(link)){toast(t("e3"));return}
  const btn=$("post");btn.disabled=true;btn.textContent=t("pi");
  let img=null,img2=null;
  try{const f=$("i").files[0];if(f)img=await fileToDataURL(f)}catch(e){}
  try{const f2=$("i2").files[0];if(f2&&cat==="ReShade Preset")img2=await fileToDataURL(f2)}catch(e){}
  posts.unshift({id:"p"+Date.now(),title,cat,desc:$("d").value.trim(),link,cmd:cat==="F8 Command"?cmd:"",img,img2,by:me.id,canceled:false,reports:[],admin:!!me.isOwner,ts:Date.now()});
  store.write(ST.posts,posts);
  ["t","d","l","m","i","i2"].forEach(k=>$(k).value="");
  $("dlg").close();
  btn.disabled=false;btn.textContent=t("po");
  render();
};

/* ===== BOOT ===== */
$("teamb").onclick=()=>{$("tdlg").showModal();renderTeam()};
$("resetb").onclick=openReset;
$("tq").oninput=renderTeam;
$("tc").onclick=()=>$("tdlg").close();

setLang(L);
bootUser();
