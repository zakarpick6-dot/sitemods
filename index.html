<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Citizen &amp; Mods — FiveM Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Cairo:wght@600;900&display=swap">
<style>
:root{--bg:#dcdad2;--ink:#111;--card:#efede6;--mut:#58564f;--y:#ffd400;--ln:#111;--fi:#111;--fm:#58564f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--ink:#f3f1ea;--card:#171717;--mut:#8d8d86;--ln:#f3f1ea;--fi:#f3f1ea;--fm:#8d8d86}}
:root[data-theme="dark"]{--bg:#0d0d0d;--ink:#f3f1ea;--card:#171717;--mut:#8d8d86;--ln:#f3f1ea;--fi:#f3f1ea;--fm:#8d8d86}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Space Mono",ui-monospace,Menlo,monospace;overflow-x:hidden}
:lang(ar) body,:lang(ar) input,:lang(ar) select,:lang(ar) textarea,:lang(ar) button{font-family:Cairo,"Space Mono",sans-serif}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.glow{display:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 0;font-size:11px;color:var(--mut);letter-spacing:.1em}
.lgs{display:flex;gap:4px}
.lg{font:700 11px inherit;font-family:inherit;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:3px 9px;cursor:pointer;transition:.15s}
.lg.on,.lg:hover{background:var(--y);color:#111;border-color:#111}
h1{font:400 clamp(56px,13vw,150px)/.88 Anton,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;margin:24px 0 10px;direction:ltr;text-align:start}
h1 em{font-style:normal;color:var(--y);-webkit-text-stroke:2px #111;paint-order:stroke fill}
.sub{max-width:520px;color:var(--mut);margin:14px 0 22px}
.strip{direction:ltr;background:var(--y);color:#111;overflow:hidden;white-space:nowrap;border-block:3px solid #111;transform:rotate(-1.2deg) scale(1.03);margin:18px 0 26px;padding:0}
.strip div{display:inline-block;padding:8px 0;animation:mq 22s linear infinite;font-weight:700}
.strip span{margin:0 18px}.strip i{font-style:normal}
@keyframes mq{to{transform:translateX(-50%)}}
.road{height:6px;background:repeating-linear-gradient(90deg,var(--y) 0 34px,transparent 34px 64px);margin:6px 0 22px;animation:rd 1.6s linear infinite;background-size:64px 6px}
@keyframes rd{to{background-position:64px 0}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}
.chip{font:700 13px inherit;font-family:inherit;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:6px 12px;cursor:pointer;transition:.15s}
.chip:hover{transform:translateY(-3px) rotate(-2deg)}
.chip.on{background:var(--ink);color:var(--bg)}
.up{margin-inline-start:auto;background:var(--y);color:#111;border:3px solid #111;box-shadow:5px 5px 0 #111;font:700 13px inherit;font-family:inherit;padding:9px 18px;cursor:pointer;transition:.15s}
.up:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 #111}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--card);color:var(--ink);border:2px solid var(--ink);padding:0 0 14px;display:flex;flex-direction:column;gap:6px;transition:transform .2s,box-shadow .2s;animation:in .5s both}
.card:nth-child(3n+1){transform:rotate(-1.2deg)}.card:nth-child(3n+2){transform:rotate(.8deg)}.card:nth-child(3n){transform:rotate(-.4deg)}
.card:hover{transform:rotate(0) translateY(-6px);box-shadow:8px 8px 0 var(--y)}
@keyframes in{from{opacity:0;margin-top:24px}}
.card::before,.card::after{display:none}
.img{height:150px;background:#111 center/cover;display:flex;align-items:center;justify-content:center;color:var(--y);font:400 46px Anton,sans-serif;position:relative;overflow:hidden;filter:none}
.img .a{position:absolute;inset:0;background:center/cover;clip-path:inset(0 0 0 var(--w,100%))}
.img .ln{position:absolute;top:0;bottom:0;width:3px;background:var(--y);left:var(--w,100%);display:none}
.rs:hover .ln{display:block}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700;color:var(--mut);padding:4px 14px 0}
.meta b{background:#111;color:var(--y);padding:0 6px}
h3{font:400 26px/1 Anton,Impact,sans-serif;text-transform:uppercase;margin:0;padding:0 14px}
.card p{margin:0;padding:0 14px;color:var(--mut);font-size:13px;flex:1;word-break:break-word}
code{display:block;direction:ltr;background:#111;color:var(--y);padding:6px 8px;font-size:12px;overflow-x:auto;white-space:pre;margin:0 14px}
.act{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px}
.act a,.act button{flex:1;min-width:88px;text-align:center;font:700 13px inherit;font-family:inherit;padding:7px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);text-decoration:none;cursor:pointer}
.act .x{flex:0 0 36px;background:transparent;color:var(--ink)}
.msg{grid-column:1/-1;border:2px dashed var(--ink);padding:40px 20px;text-align:center;color:var(--mut)}
dialog{border:3px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;max-width:440px;width:calc(100% - 28px);padding:20px;box-shadow:10px 10px 0 var(--y)}
dialog::backdrop{background:#000a}
dialog h2{font:400 34px/1 Anton,sans-serif;text-transform:uppercase;margin:0 0 10px}
label{display:block;font-weight:700;font-size:12px;margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)}
.f{display:flex;gap:8px;margin-top:16px}.f button{flex:1;font:700 13px inherit;font-family:inherit;padding:10px;border:2px solid var(--ink);cursor:pointer;background:transparent;color:var(--ink)}
.f .go{background:var(--y);color:#111;border-color:#111}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cx{opacity:.62}.cx .img{filter:grayscale(1)}.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);border:4px solid #ff3b30;color:#ff3b30;background:#000b;font:400 30px Anton,Impact,sans-serif;text-transform:uppercase;padding:0 14px;letter-spacing:.04em}.rsn{color:#ff3b30!important;font-weight:700}.act button:disabled{opacity:.55;cursor:default}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--y);color:#111;border:3px solid #111;box-shadow:5px 5px 0 #111;padding:10px 16px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw}#toast.on{opacity:1;transform:translate(-50%,0)}
.tr{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding:8px 0}.tr select{width:auto}#tl{max-height:46vh;overflow:auto;margin:10px 0}#me{cursor:default}
</style>

</head>
<body>

    <div class="img" ${p.img?`style="background-image:url('${esc(p.img)}')"`:""}>${p.img?"":ICON[p.cat]||"◈"}${p.img2?`<div class="a" style="background-image:url('${esc(p.img2)}')"></div><div class="ln"></div>`:""}${p.canceled?`<div class="stamp">${t("rn")}</div>`:""}</div>
    <div class="meta"><span>${String(i+1).padStart(2,"0")}A · ${esc(cn(p.cat))}</span><span>${p.admin?`<b>${t("adm")}</b>`:t("by")+" "+esc(names[p.by]||"…")}</span></div>
    <h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p>${p.canceled&&p.reason?`<p class="rsn">${esc(p.reason)}</p>`:""}
    ${p.cmd?`<code>${esc(p.cmd)}</code>`:""}
    <div class="act">${p.link&&safe(p.link)?`<a href="${safe(p.link)}" target="_blank" rel="noopener">${t("dl")}</a>`:""}${p.cmd?`<button data-cp="${p.id}">${t("cp")}</button>`:""}${p.img?`<button data-im="img" data-id="${p.id}">${t("di")}${p.img2?" 1":""}</button>`:""}${p.img2?`<button data-im="img2" data-id="${p.id}">${t("di")} 2</button>`:""}${mod(p)?`<button data-cx="${p.id}">${p.canceled?t("rs2"):t("cx")}</button>`:""}${me&&me.id&&me.id!==p.by&&!p.canceled?`<button data-rp="${p.id}" ${(p.reports||[]).includes(me.id)?"disabled":""}>⚑ ${(p.reports||[]).includes(me.id)?t("rpd"):t("rp")}</button>`:""}${isStaff()&&(p.reports||[]).length?`<button class="x" disabled>⚑ ${(p.reports||[]).length}</button>`:""}${mod(p)?`<button class="x" data-del="${p.id}">✕</button>`:""}</div>
  </div>`).join("");
  document.querySelectorAll(".card").forEach((c,i)=>{io?io.observe(c):c.classList.add("dev")});
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=async()=>{const p=posts.find(x=>x.id===b.dataset.cp);try{await navigator.clipboard.writeText(p.cmd);b.textContent=t("cd")}catch(e){}});
  document.querySelectorAll("[data-im]").forEach(b=>b.onclick=async()=>{
    const p=posts.find(x=>x.id===b.dataset.id),k=b.dataset.im,u=p[k];
    try{
      if(!dls)throw 0;
      const bl=await (await fetch(u)).blob();
      const ext={"image/png":"png","image/jpeg":"jpg","image/webp":"webp","image/gif":"gif","image/svg+xml":"svg"}[bl.type]||"png";
      const nm=((p.title||"image").replace(/[^\w\- ]+/g,"").trim().slice(0,60)||"image")+(k==="img2"?"-after":"")+"."+ext;
      await dls.save({filename:nm,data:bl});
    }catch(e){if(!e||e.code!=="declined")window.open(u,"_blank")}
  });
  document.querySelectorAll("[data-cx]").forEach(b=>b.onclick=async()=>{
    const p=posts.find(x=>x.id===b.dataset.cx);
    try{
      if(p.canceled)await db.doc("posts/"+p.id).update({canceled:false,reason:""});
      else{const r=await ask(t("rq"),true);if(r===null)return;await db.doc("posts/"+p.id).update({canceled:true,reason:r.trim().slice(0,200),canceledBy:me.id})}
    }catch(e){toast(t("e4"))}
  });
  document.querySelectorAll("[data-rp]").forEach(b=>b.onclick=async()=>{
    const p=posts.find(x=>x.id===b.dataset.rp);b.disabled=true;
    try{await db.doc("posts/"+p.id).update({reports:[...new Set([...(p.reports||[]),me.id])]})}catch(e){b.disabled=false;toast(t("e4"))}
  });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(await ask(t("q"),false)){try{await db.doc("posts/"+b.dataset.del).delete()}catch(e){toast(t("e5"))}}});
}
addEventListener("pointermove",e=>{const im=e.target.closest&&e.target.closest(".rs .img");if(im){const b=im.getBoundingClientRect();im.style.setProperty("--w",Math.min(100,Math.max(0,(e.clientX-b.left)/b.width*100))+"%")}});
$("cancel").onclick=()=>$("dlg").close();
$("post").onclick=async()=>{
  const title=$("t").value.trim(),link=$("l").value.trim(),cmd=$("m").value.trim(),cat=$("c").value;
  if(!canDrop()){toast(t("nup"));return}
  if(!title){toast(t("e1"));return}
  if(!link&&!cmd){toast(t("e2"));return}
  if(link&&!safe(link)){toast(t("e3"));return}
  const btn=$("post");btn.disabled=true;btn.textContent=t("pi");
  let img=null,img2=null;
  if(assets){
    try{const f=$("i").files[0];if(f)img=(await assets.upload(f)).url}catch(e){}
    try{const f=$("i2").files[0];if(f&&cat==="ReShade Preset")img2=(await assets.upload(f)).url}catch(e){}
  }
  try{
    await db.collection("posts").add({title,cat,desc:$("d").value.trim(),link,cmd:cat==="F8 Command"?cmd:"",img,img2,by:me.id,canceled:false,reports:[],admin:!!me.isOwner,ts:Date.now()});
    ["t","d","l","m","i","i2"].forEach(k=>$(k).value="");$("dlg").close();
  }catch(e){toast(t("e4"))}
  btn.disabled=false;btn.textContent=t("po");
};
(async()=>{
  setLang(L);
  try{
    [db,user,assets,dls]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("assets"),claude.use("downloads")]);
    me=user?await user.me():null;
  }catch(e){db=null}
  if(!db){$("grid").innerHTML=`<div class="msg">${t("si")}</div>`;return}
  if(!assets)$("iw").hidden=true;
  myRole=me&&me.isOwner?"owner":"member";updateTop();
  if(me&&me.id){
    try{if(!me.isOwner){const g=await db.doc("roles/"+me.id).get();if(!g.exists)await db.doc("roles/"+me.id).set({role:"member",ts:Date.now()})}}catch(e){}
    db.collection("roles").onSnapshot(sn=>{roles={};sn.docs.forEach(d=>{roles[d.id]=d.data().role});myRole=me.isOwner?"owner":(roles[me.id]||"member");updateTop();render();if($("tdlg").open)renderTeam()},()=>{});
    $("teamb").onclick=()=>{$("tdlg").showModal();renderTeam()};$("tq").oninput=renderTeam;$("tc").onclick=()=>$("tdlg").close();
  }
  db.collection("posts").orderBy("ts","desc").onSnapshot(async s=>{
    posts=s.docs.map(d=>({id:d.id,...d.data()}));
    try{const pr=await user.profiles([...new Set(posts.map(p=>p.by).filter(Boolean))]);for(const k in pr)names[k]=pr[k].name}catch(e){}
    render();
  },()=>{$("grid").innerHTML=`<div class="msg">${t("si")}</div>`});
})();
</script>
</body>
</html>
